[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-risk-algorithm"
version = "0.1.0.dev0"
description = "Platform-independent multimodal fall-risk training and inference package"
requires-python = ">=3.10,<3.13"

[project.optional-dependencies]
train = [
  "torch==2.4.1",
  "torchvision==0.19.1",
]
dev = [
  "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
